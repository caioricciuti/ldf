# Formatting, lints, tests and the small round trip on every push and pull
# request. The only external action is actions/checkout, pinned to a commit
# hash (v7.0.1, 2026-07-17); the toolchain comes from rust-toolchain.toml
# through the rustup that GitHub's runners ship with.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: rustup show active-toolchain && cargo --version
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build --release
      - name: Tests
        run: cargo test --release
      - name: Round trip on the committed fixtures
        run: ./target/release/ldf-bench roundtrip --scale small

  # The proxy launches servers through .cmd files and the release ships a
  # Windows binary, so ldf-mcp is built and tested there too. Not a
  # required check until it has a record of passing.
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: rustup show active-toolchain; cargo --version
      - name: Clippy
        run: cargo clippy -p ldf-mcp --all-targets -- -D warnings
      - name: Tests
        run: cargo test --release -p ldf-mcp
