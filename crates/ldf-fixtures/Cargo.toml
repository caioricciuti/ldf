[package]
name = "ldf-fixtures"
description = "Deterministic synthetic dataset generator for the LDF research workspace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "ldf-gen"
path = "src/main.rs"

[features]
default = ["parquet"]
parquet = ["ldf-data/parquet"]

[dependencies]
ldf-data = { workspace = true }
ldf-formats = { workspace = true }
serde_json = { workspace = true }
