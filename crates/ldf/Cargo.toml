[package]
name = "ldf"
description = "Language Data Format: a lossless, line-oriented text encoding of JSON records that language models read for fewer tokens"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://ldflabs.org"
documentation = "https://ldflabs.org/docs/spec/"
keywords = ["llm", "serialization", "tokens", "json", "format"]
categories = ["encoding", "parser-implementations"]

[features]
# Direct Arrow RecordBatch encoder (module `arrow`), no Value per row.
arrow = ["dep:arrow", "ldf-data/parquet"]

[dependencies]
ldf-data = { workspace = true }
arrow = { workspace = true, optional = true }
serde_json = { workspace = true }

[dev-dependencies]
serde = { workspace = true }
parquet = { workspace = true }
