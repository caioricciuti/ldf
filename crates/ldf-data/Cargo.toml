[package]
name = "ldf-data"
description = "Value model, numeric semantics and input readers (JSON, JSONL, CSV, Parquet) for LDF, the Language Data Format"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://ldflabs.org"
keywords = ["llm", "json", "parquet", "csv"]
categories = ["encoding", "parser-implementations"]

[features]
default = ["parquet", "simd"]
# Parquet input via apache/arrow-rs. Heavy dependency tree; off when not needed.
parquet = ["dep:parquet", "dep:arrow"]
# SIMD JSON parsing path (simd-json). The serde_json path is always available.
simd = ["dep:simd-json"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
simd-json = { workspace = true, optional = true }
csv = { workspace = true }
arrow = { workspace = true, optional = true }
parquet = { workspace = true, optional = true }
